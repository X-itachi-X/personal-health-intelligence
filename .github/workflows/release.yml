name: Production Release

# Push to main → verify → deploy backend + web + official APK to edge server.
# Edge user download portal: ${PUBLIC_URL}/downloads/
#
# One-time setup (see infrastructure/ci/README.md):
#   1. Self-hosted runner on your LAN PC (labels: self-hosted, edge-lan)
#   2. Runner: JDK 21, Node 22, ssh access to edge host
#   3. GitHub secrets: EXPO_TOKEN, PUBLIC_URL
#   4. Optional secret: EDGE_HOST (default: edge)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prod-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend tests
        working-directory: backend
        run: ./gradlew test

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Mobile install
        working-directory: mobile
        run: npm ci

  deploy-production:
    name: Deploy Production Release
    needs: verify
    runs-on: [self-hosted, edge-lan]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Release Production to Edge
        env:
          CI: "true"
          BUILD_APK: "1"
          RELEASE_CHANNEL: "users"
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EDGE_HOST: ${{ secrets.EDGE_HOST }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x infrastructure/ci/*.sh
          ./infrastructure/ci/ci-release.sh

      - name: Upload Production APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-prod-apk-${{ github.run_number }}
          path: mobile/**/*.apk
          retention-days: 30

      - name: Production Smoke Check
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          curl -fsS "${PUBLIC_URL}/api/v1/health" | grep -q '"status":"ok"'
          curl -fsS "${PUBLIC_URL}/downloads/android.json" | grep -q versionCode
          curl -fsS "${PUBLIC_URL}/downloads/" | grep -q "Official Release"
