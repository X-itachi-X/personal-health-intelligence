name: CI/CD Pipeline

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend tests
        working-directory: backend
        run: ./gradlew test

      - name: Checkstyle
        working-directory: backend
        run: ./gradlew checkstyleMain checkstyleTest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Mobile install
        working-directory: mobile
        run: npm ci

      - name: TypeScript check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: mobile
        run: npx eslint .

  deploy:
    name: Deploy
    needs: verify
    runs-on: [self-hosted, edge-lan]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Deploy to Edge
        env:
          CI: "true"
          BUILD_APK: "1"
          RELEASE_CHANNEL: ${{ github.ref == 'refs/heads/main' && 'users' || 'testers' }}
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EDGE_HOST: ${{ secrets.EDGE_HOST }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x infrastructure/ci/*.sh
          if [ "${{ github.ref == 'refs/heads/main' }}" = "true" ]; then
            ./infrastructure/ci/ci-release.sh
          else
            ./infrastructure/ci/ci-test-release.sh
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-${{ github.ref == 'refs/heads/main' && 'prod' || 'tester' }}-apk-${{ github.run_number }}
          path: mobile/**/*.apk
          retention-days: ${{ github.ref == 'refs/heads/main' && 30 || 14 }}

      - name: Smoke Check
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          if [ "${{ github.ref == 'refs/heads/main' }}" = "true" ]; then
            curl -fsS "${PUBLIC_URL}/api/v1/health" | grep -q '"status":"ok"'
            curl -fsS "${PUBLIC_URL}/downloads/android.json" | grep -q versionCode
            curl -fsS "${PUBLIC_URL}/downloads/" | grep -q "Official Release"
          else
            curl -fsS "${PUBLIC_URL}/downloads/testers/android.json" | grep -q versionCode
            curl -fsS "${PUBLIC_URL}/downloads/testers/" | grep -q "Preview Channel"
          fi

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/test'
        with:
          name: backend-test-jar-${{ github.run_number }}
          path: backend/build/libs/backend-*.jar
          retention-days: 14

      - name: Upload Mobile Web Artifact
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/test'
        with:
          name: mobile-web-dist-${{ github.run_number }}
          path: mobile/dist
          retention-days: 14
