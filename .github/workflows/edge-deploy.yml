# Deprecated — use .github/workflows/release.yml instead.
# Kept for manual JAR-only deploys if needed.

name: Edge deploy (JAR only)

on:
  workflow_dispatch:

jobs:
  deploy-jar-only:
    runs-on: [self-hosted, edge-lan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and deploy JAR only
        env:
          EDGE_HOST: ${{ secrets.EDGE_HOST }}
          SKIP_APK: "1"
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          chmod +x infrastructure/ci/*.sh
          ./infrastructure/ci/publish-testers-to-edge.sh
