name: Test Pipeline & Artifacts

# Triggered on push or PR to `test` branch, or manual dispatch.
# Tests code, builds backend & mobile artifacts, uploads GitHub Actions artifacts,
# and deploys preview build to the tester downloads portal (/downloads/testers/).

on:
  push:
    branches: [test]
  pull_request:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: test-pipeline
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Backend Unit Tests
        working-directory: backend
        run: ./gradlew test

      - name: Build Backend JAR
        working-directory: backend
        run: ./gradlew bootJar -x test

      - name: Upload Backend JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-jar-${{ github.run_number }}
          path: backend/build/libs/backend-*.jar
          retention-days: 14

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Mobile Dependencies
        working-directory: mobile
        run: npm ci

      - name: Export Mobile Web Dist
        working-directory: mobile
        run: npx expo export --platform web

      - name: Upload Mobile Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-web-dist-${{ github.run_number }}
          path: mobile/dist
          retention-days: 14

  deploy-tester:
    name: Deploy to Tester Portal
    needs: test-and-build
    runs-on: [self-hosted, edge-lan]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/test'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & Publish Tester Release
        env:
          CI: "true"
          BUILD_APK: "1"
          RELEASE_CHANNEL: "testers"
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EDGE_HOST: ${{ secrets.EDGE_HOST }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x infrastructure/ci/*.sh
          ./infrastructure/ci/ci-test-release.sh

      - name: Upload Tester APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-tester-apk-${{ github.run_number }}
          path: mobile/**/*.apk
          retention-days: 14

      - name: Smoke Check Tester Portal
        env:
          PUBLIC_URL: ${{ secrets.PUBLIC_URL }}
        run: |
          curl -fsS "${PUBLIC_URL}/downloads/testers/android.json" | grep -q versionCode
          curl -fsS "${PUBLIC_URL}/downloads/testers/" | grep -q "Preview Channel"
