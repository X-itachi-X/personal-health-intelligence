spring:
  application:
    name: phi
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: 8080

phi:
  storage:
    reports-dir: ${user.home}/.phi/reports
  claude:
    api-key: ${CLAUDE_API_KEY:}
    workspace-id: ${CLAUDE_WORKSPACE_ID:}
    model: ${CLAUDE_MODEL:claude-sonnet-4-6}
  cors:
    allowed-origins: http://localhost:8081,http://127.0.0.1:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.phi: INFO
